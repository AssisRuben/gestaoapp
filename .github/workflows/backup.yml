# Backup diário do banco de produção (Supabase). Roda todo dia às 03:00 de Fortaleza (06:00 UTC) e
# também pelo botão "Run workflow" na aba Actions.
#
# O repositório é PÚBLICO: artefato de Actions pode ser baixado por qualquer conta do GitHub. Por isso
# o dump só sai daqui criptografado (AES-256, senha no secret BACKUP_PASSPHRASE) e o arquivo aberto
# nunca é enviado. Como restaurar: deploy/BACKUP.md.
#
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL      — URI do "Session pooler" do Supabase (com a senha do banco)
#   BACKUP_PASSPHRASE    — senha da criptografia (guardar fora do GitHub também!)
name: Backup do banco

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Conferir secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Faltam os secrets SUPABASE_DB_URL e/ou BACKUP_PASSPHRASE."
            exit 1
          fi
          if [ ${#BACKUP_PASSPHRASE} -lt 16 ]; then
            echo "::error::BACKUP_PASSPHRASE precisa ter pelo menos 16 caracteres."
            exit 1
          fi

      # pg_dump 17 (cliente mais novo que o servidor funciona; mais velho não). Esquemas: public
      # (dados das fazendas), auth (contas/logins) e storage (registro dos arquivos — os arquivos
      # em si, como as fotos do botijão, NÃO entram no dump).
      - name: Dump
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          docker run --rm -e PGURL="$SUPABASE_DB_URL" postgres:17 \
            sh -c 'pg_dump "$PGURL" --format=custom --no-owner --no-privileges --schema=public --schema=auth --schema=storage' \
            > banco.dump
          tamanho=$(stat -c %s banco.dump)
          echo "Tamanho do dump: $tamanho bytes"
          if [ "$tamanho" -lt 10000 ]; then
            echo "::error::Dump pequeno demais — algo deu errado."
            exit 1
          fi

      # confere que o arquivo abre (lista o conteúdo) antes de guardar
      - name: Conferir o dump
        run: |
          docker run --rm -v "$PWD:/b" postgres:17 pg_restore --list /b/banco.dump > lista.txt
          echo "Itens no dump: $(wc -l < lista.txt)"
          grep -q "TABLE DATA public vacas" lista.txt || { echo "::error::O dump não tem os dados de vacas."; exit 1; }

      - name: Criptografar
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          echo "DATA=$(TZ=America/Fortaleza date +%Y-%m-%d)" >> "$GITHUB_ENV"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o banco.dump.gpg banco.dump
          rm -f banco.dump lista.txt

      - uses: actions/upload-artifact@v4
        with:
          name: gestaopec-banco-${{ env.DATA }}
          path: banco.dump.gpg
          retention-days: 30
          if-no-files-found: error
